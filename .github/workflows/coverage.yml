# Measure test coverage on pushes and upload the report to Codecov.

name: Coverage

on:
  push:
    # Every branch, so work in progress gets the same coverage run as `main` does.
    # Dependabot's are the exception: GitHub hands its runs Dependabot secrets rather than Actions
    # secrets, so `CODECOV_TOKEN` would be empty and the upload would fail on every bump. A bump's
    # coverage run is the one that happens on `main` after it merges.
    branches-ignore: ['dependabot/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecov:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # The newest Python the project supports, i.e. the top of the CI matrix —
        # that is where new-syntax code paths actually run. Bump this whenever the
        # matrix grows; nothing else will remind you.
        python-version: "3.15"
        allow-prereleases: true
    - name: Install PDM
      run: |
        python -m pip install --upgrade pip
        pip install pdm
    - name: Install dependencies
      run: |
        # Point PDM at the interpreter `setup-python` already installed, rather than
        # letting it fetch a second one — its index has no prerelease build, so asking
        # for a version like "3.15" fails while that very interpreter is on PATH.
        # Ask Python for its own path: under Git Bash on Windows, `which python` gives
        # an MSYS path that PDM, a native Windows program, cannot resolve.
        pdm use -f "$(python -c 'import sys; print(sys.executable)')"
        pdm install
    - name: Generate coverage report
      run: |
        pdm run coverage run -m pytest tests/
        pdm run coverage xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
